      - generic [ref=f9e45]:
        - generic [ref=f9e46]:
          - text: "01"
          - heading "Who we are" [level=2] [ref=f9e47]
          - paragraph [ref=f9e48]:
            - text: This policy describes how Cephionix Software Developer (OPC) Pvt. Ltd. handles information in connection with this company website and enquiries sent through it. Contact us at
            - link "hello@cephionix.com" [ref=f9e49] [cursor=pointer]:
              - /url: mailto:hello@cephionix.com
            - text: . Linked products, including NeuralWings and EarnWings, have their own privacy notices.
        - generic [ref=f9e50]:
          - text: "02"
          - heading "Information you choose to share" [level=2] [ref=f9e51]
          - paragraph [ref=f9e52]: The enquiry form asks for your name, email address, area of interest and project description. Please include only the information needed for your enquiry and avoid sending passwords, payment details or sensitive personal records.
        - generic [ref=f9e53]:
          - text: "03"
          - heading "How the enquiry form works" [level=2] [ref=f9e54]
          - paragraph [ref=f9e55]: Selecting “Prepare your enquiry” opens your email application with a draft addressed to hello@cephionix.com. The website does not send that draft automatically or save the form entries to a website database. You choose whether to send it through your email provider. If you send it, we receive the information in that email.
        - generic [ref=f9e56]:
          - text: "04"
          - heading "How we use information" [level=2] [ref=f9e57]
          - paragraph [ref=f9e58]: We use enquiries to respond to questions, understand project requirements, discuss our products or services and manage the resulting business relationship. If you request launch information, we use your contact details to respond to that request. We do not use this website to sell personal information or run targeted advertising.
        - generic [ref=f9e59]:
          - text: "05"
          - heading "Website hosting and technical information" [level=2] [ref=f9e60]
          - paragraph [ref=f9e61]: The hosting platform and its infrastructure providers may process technical information such as IP address, browser details, requested pages and timestamps to deliver the website, manage access, diagnose problems and protect the service. This website is hosted on GitHub Pages. We also use Google Analytics to understand how visitors use the site, which collects information such as pages viewed, approximate location, device and browser type, and how you arrived at the site. This information is used in aggregate to improve the website.
        - generic [ref=f9e62]:
          - text: "06"
          - heading "Cookies, fonts and external services" [level=2] [ref=f9e63]
          - paragraph [ref=f9e64]: We do not add advertising pixels to this website. We use Google Analytics, a web analytics service provided by Google, which sets cookies or uses similar technologies in your browser to measure website traffic and usage. These analytics cookies are only used if you click “Accept” on the cookie banner; until then, analytics storage stays switched off. You can change your choice at any time using “Cookie settings” in the page footer. Google processes this information on our behalf under its own privacy policy, and you can opt out using the Google Analytics opt-out browser add-on (tools.google.com/dlpage/gaoptout) or your browser’s cookie settings. The hosting platform may also use cookies or similar technologies for access and security. Fonts may be loaded from Google Fonts; your browser connects to that service to retrieve them and shares the technical information required for that request. Product links and your email application are external services with their own privacy practices.
        - generic [ref=f9e65]:
          - text: "07"
          - heading "Sharing and service providers" [level=2] [ref=f9e66]
          - paragraph [ref=f9e67]: Information may be processed by providers used for website hosting, email delivery and business communications. We may also share information when necessary to comply with a valid legal obligation or to protect the security and rights of our business and users. We do not publish your enquiry.
        - generic [ref=f9e68]:
          - text: "08"
          - heading "Retention and security" [level=2] [ref=f9e69]
          - paragraph [ref=f9e70]: We keep correspondence for as long as reasonably needed to respond, manage the relationship and meet applicable record-keeping obligations. Retention can also depend on our email and service providers. We take reasonable care with information, but no online service or email transmission can be guaranteed completely secure.
        - generic [ref=f9e71]:
          - text: "09"
          - heading "Your choices and requests" [level=2] [ref=f9e72]
          - paragraph [ref=f9e73]: You can choose not to send an enquiry. To ask about information you have shared, request correction or deletion, or withdraw a request for future contact, email hello@cephionix.com. We will consider your request and any applicable obligations; we may need to verify who is making it.
        - generic [ref=f9e74]:
          - text: "10"
          - heading "Children and third-party websites" [level=2] [ref=f9e75]
          - paragraph [ref=f9e76]: This company website is intended for people exploring our business, products and services. We do not intentionally request personal information from children through it. If you believe a child has sent us personal information, contact us. We are not responsible for the information practices of linked websites.
        - generic [ref=f9e77]:
          - text: "11"
          - heading "Updates and contact" [level=2] [ref=f9e78]
          - paragraph [ref=f9e79]: We may update this policy when the website or its information practices change. The date on this page identifies the latest revision. For privacy questions or concerns, contact hello@cephionix.com.
